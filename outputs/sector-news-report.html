<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>A 股板块资讯报告</title>
  <style>
    :root{--bg:#f6f8fb;--panel:#fff;--text:#172033;--muted:#697386;--line:#dbe3ef;--brand:#0f766e;--soft:#e8f5f2;--red:#c2410c;--green:#15803d}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Microsoft YaHei",sans-serif;line-height:1.55}
    header{background:#10233f;color:#fff}.wrap{max-width:1180px;margin:0 auto;padding:24px}h1{margin:0 0 8px;font-size:28px}.sub{margin:0;color:#d9e4f2}
    .bar{display:flex;justify-content:space-between;gap:16px;align-items:center;margin:18px 0}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    button,a.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 12px;color:var(--text);text-decoration:none;cursor:pointer}
    select{border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:#fff}.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin:18px 0;padding:18px}
    .head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:14px}
    .head h2{margin:0;font-size:22px}.meta{color:var(--muted);font-size:13px}.badge{display:inline-flex;align-items:center;border-radius:999px;background:var(--soft);color:var(--brand);padding:4px 10px;font-size:12px;white-space:nowrap}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.sector{border:1px solid var(--line);border-radius:8px;padding:14px;background:#fff}.sector h3{margin:0 0 6px;font-size:18px}
    .stats{display:flex;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-bottom:10px}.stocks{font-size:13px;color:var(--muted);margin:8px 0 12px}.news{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
    .news h4{margin:0 0 4px;font-size:15px}.news a{color:#0f5da8;text-decoration:none}.summary{white-space:pre-wrap;background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:10px;font-size:13px}
    .related{margin:8px 0 0;padding-left:18px;color:var(--muted);font-size:12px}.empty{border:1px dashed var(--line);border-radius:8px;padding:18px;color:var(--muted);background:#fff}
    footer{color:var(--muted);font-size:12px;padding-bottom:28px}@media(max-width:900px){.grid{grid-template-columns:1fr}.bar,.head{display:block}.actions{margin-top:10px}}
  </style>
</head>
<body>
  <header><div class="wrap"><h1>A 股板块资讯报告</h1><p class="sub">工作日 13:30 更新午盘资讯，21:00 更新收盘资讯。数据源原则：免费源优先 + 结合现有行情行业/概念推导热门板块。</p></div></header>
  <main class="wrap">
    <div class="bar">
      <div class="actions"><a class="btn" href="index.html">行情热度报告</a><a class="btn" href="backtest-2025.html">2025回测</a></div>
      <label>资讯日期 <select id="dateSelect"></select></label>
    </div>
    <section id="midday" class="panel"></section>
    <section id="close" class="panel"></section>
  </main>
  <footer class="wrap">新闻仅展示标题、摘要、来源、时间和链接；AI 总结只基于已获取的公开信息，不构成投资建议。</footer>
  <script>
    const S={dates:[],date:"",report:null};
    const $=id=>document.getElementById(id);
    $("dateSelect").onchange=async e=>{S.date=e.target.value;await loadDate();render()};
    init();
    async function init(){await loadIndex();await loadDate();render()}
    async function loadIndex(){
      try{const idx=await json("data/reports/news-index.json");S.dates=(idx.reports||[]).map(i=>i.date)}
      catch{try{const latest=await json("data/reports/news-latest.json");S.dates=latest.date?[latest.date]:[]}catch{S.dates=[]}}
      S.date=S.dates[0]||"";
      $("dateSelect").innerHTML=S.dates.map(d=>`<option value="${esc(d)}">${esc(d)}</option>`).join("");
      $("dateSelect").value=S.date;
    }
    async function loadDate(){
      if(!S.date){S.report=null;return}
      try{S.report=await json(`data/reports/news/${encodeURIComponent(S.date)}.json`)}
      catch{S.report={date:S.date,midday:null,close:null}}
    }
    function render(){
      if(!S.report){$("midday").innerHTML=empty("暂无已生成资讯报告。");$("close").innerHTML=empty("暂无已生成资讯报告。");return}
      renderSession("midday",S.report.midday,"午盘资讯","等待 13:30 生成");
      renderSession("close",S.report.close,"收盘资讯","等待 21:00 生成");
    }
    function renderSession(id,report,title,waiting){
      if(!report){$(id).innerHTML=sessionHead(title,null,"waiting")+empty(waiting);return}
      const sectors=report.sectors||[];
      $(id).innerHTML=sessionHead(title,report)+(
        sectors.length?`<div class="grid">${sectors.map(sectorCard).join("")}</div>`:empty(report.message||"暂无足够真实资讯。")
      );
    }
    function sessionHead(title,r,status){
      return `<div class="head"><div><h2>${esc(title)}</h2><div class="meta">${r?`生成时间：${dt(r.generatedAt)}；来源：${esc(r.source||"-")}；模型：${esc(r.model||"-")}`:""}</div></div><span class="badge">${esc(r?.status||status||"未生成")}</span></div>`;
    }
    function sectorCard(s){
      return `<article class="sector"><h3>${esc(s.name)}</h3><div class="stats"><span>热度 ${esc(s.heatScore)}</span><span>股票 ${esc(s.stockCount)} 只</span><span>新闻 ${(s.news||[]).length} 条</span></div><div class="stocks">${(s.topStocks||[]).slice(0,5).map(i=>`${esc(i.name)} ${pct(i.changePct)}`).join(" / ")}</div>${deepseek(s.deepseek)}${(s.news||[]).map(newsItem).join("")}</article>`;
    }
    function newsItem(n){
      const related=(n.relatedReports||[]).map(r=>`<li><a href="${esc(r.url)}" target="_blank" rel="noreferrer">${esc(r.title)}</a> <span>${esc(r.source||"")}</span></li>`).join("");
      return `<div class="news"><h4>#${esc(n.rank)} <a href="${esc(n.url)}" target="_blank" rel="noreferrer">${esc(n.title)}</a></h4><div class="meta">${esc(n.source||"-")} · ${dt(n.publishedAt)} · 影响分 ${esc(n.impactScore||"-")}</div>${n.summary?`<p>${esc(n.summary)}</p>`:""}${related?`<ul class="related">${related}</ul>`:""}</div>`;
    }
    function deepseek(d){if(!d)return"";if(d.status==="ok"&&d.summary)return`<div class="summary">${esc(d.summary)}</div>`;return`<div class="summary">DeepSeek：${esc(d.reason||d.error||d.status||"未生成分析")}</div>`}
    async function json(url){const r=await fetch(url,{cache:"no-store"});if(!r.ok)throw new Error(`${r.status}`);return r.json()}
    function empty(text){return`<div class="empty">${esc(text)}</div>`}
    function dt(v){if(!v)return"-";try{return new Date(v).toLocaleString("zh-CN",{hour12:false})}catch{return v}}
    function pct(v){const n=Number(v);return Number.isFinite(n)?`${n.toFixed(2)}%`:"-"}
    function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
  </script>
</body>
</html>
