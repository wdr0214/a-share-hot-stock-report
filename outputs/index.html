<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A 股行情热度报告</title>
  <style>
    :root{--ink:#17202c;--muted:#667085;--line:#d8dee8;--paper:#fff;--red:#d84b47;--green:#178f61;--shadow:0 10px 28px rgba(26,32,44,.08)}
    *{box-sizing:border-box}body{margin:0;font-family:"Microsoft YaHei","PingFang SC","Segoe UI",Arial,sans-serif;color:var(--ink);background:#eef2f6}
    header{background:#17202c;color:#fff;padding:22px 28px 18px;border-bottom:4px solid #d7a43b}.wrap{max-width:1280px;margin:0 auto}
    .top{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end}h1{margin:0;font-size:clamp(26px,4vw,42px);letter-spacing:0}.sub{margin:8px 0 0;color:#c9d2df;line-height:1.6;max-width:920px}
    .schedule{min-width:300px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:14px 16px}.row{display:flex;justify-content:space-between;gap:14px;color:#dbe4ef;font-size:13px;line-height:1.8}
    main{padding:22px 28px 36px}.controls{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}.tabs{display:flex;gap:8px;flex-wrap:wrap}
    button,select{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;min-height:38px;padding:0 14px;font-weight:700}button{cursor:pointer}button.active{background:#17202c;color:#fff;border-color:#17202c}.pick{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;font-weight:700}
    .metrics{display:grid;grid-template-columns:repeat(4,minmax(160px,1fr));gap:12px;margin-bottom:18px}.metric,.meta,.card,.empty,.prev{background:var(--paper);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}
    .metric{padding:14px 16px;min-height:86px}.metric span{display:block;color:var(--muted);font-size:13px;margin-bottom:8px}.metric b{display:block;font-size:24px;line-height:1.2}
    .meta{padding:16px 18px;margin-bottom:16px;display:flex;justify-content:space-between;gap:20px;align-items:center}.meta h2{margin:0 0 6px;font-size:20px}.meta p{margin:0;color:var(--muted);line-height:1.6}
    .badge{display:inline-flex;border-radius:999px;padding:6px 10px;background:#fff6dc;color:#7d560d;border:1px solid #efd28a;font-size:13px;font-weight:800;white-space:nowrap}
    .prev{padding:16px 18px;margin-bottom:14px}.prev h3{margin:0 0 12px;font-size:16px}.prevgrid{display:grid;grid-template-columns:repeat(5,minmax(140px,1fr));gap:10px}.previtem{border:1px solid #e2e7ef;border-radius:8px;padding:10px 12px;background:#fbfcfe}.previtem span{display:block;color:var(--muted);font-size:12px;overflow-wrap:anywhere}.previtem b{display:block;margin-top:6px;font-size:18px}.previtem small{display:block;color:var(--muted);line-height:1.55;margin-top:6px}
    .list{display:grid;gap:14px}.card{overflow:hidden}.head{display:grid;grid-template-columns:minmax(220px,1.3fr) repeat(3,minmax(145px,.7fr));gap:14px;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line);background:#fbfcfe}
    .title{display:flex;align-items:center;min-width:0}.rank{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;background:#17202c;color:#fff;border-radius:8px;font-weight:900;margin-right:10px;flex:0 0 auto}.name b{display:block;font-size:19px;overflow-wrap:anywhere}.name span{display:block;color:var(--muted);font-size:13px;margin-top:3px}.field span{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}.field b{font-size:18px}
    .body{display:grid;grid-template-columns:minmax(280px,1fr) minmax(320px,460px);gap:18px;padding:18px}.points h3,.chart h3{margin:0 0 10px;font-size:16px}.points ul{margin:0;padding-left:20px;line-height:1.75}.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.tags span{background:#eef7f6;color:#145e58;border:1px solid #c8e3df;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800}.warn{margin-top:10px;color:#92400e;background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.6}
    .chart{border-left:1px solid var(--line);padding-left:18px;min-width:0}canvas{width:100%;height:230px;display:block;background:#fbfcfe;border:1px solid #e2e7ef;border-radius:8px}.cap{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:12px;margin-top:8px}
    table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:var(--shadow)}th,td{text-align:left;padding:14px 16px;border-bottom:1px solid var(--line);vertical-align:top}th{background:#17202c;color:#fff;font-size:13px}.empty{padding:28px;color:var(--muted);text-align:center;line-height:1.8}.empty b{color:var(--ink)}
    @media(max-width:960px){.top,.body,.meta{grid-template-columns:1fr;display:grid}.schedule{min-width:0}.metrics{grid-template-columns:repeat(2,minmax(150px,1fr))}.prevgrid{grid-template-columns:repeat(2,minmax(140px,1fr))}.head{grid-template-columns:1fr 1fr}.chart{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:16px}}
    @media(max-width:620px){header,main{padding-left:16px;padding-right:16px}.metrics,.head,.prevgrid{grid-template-columns:1fr}.controls{align-items:stretch}.tabs,.pick{width:100%}button,select{flex:1}th,td{padding:11px 10px}}
  </style>
</head>
<body>
  <header><div class="wrap top"><div><h1>A 股行情热度报告</h1><p class="sub">交易日 14:55 生成尾盘报告，16:00 生成日报；周五 22:15 汇总周报。热度来自成交额、大单资金净额、涨跌幅、换手率、量比、振幅和趋势，不使用模拟数据。</p></div><div class="schedule"><strong>自动任务</strong><div class="row"><span>尾盘报告</span><b>14:55</b></div><div class="row"><span>交易日日报</span><b>16:00</b></div><div class="row"><span>周五周报</span><b>22:15</b></div><div class="row"><span>下次日报</span><b id="nextRun">计算中</b></div></div></div></header>
  <main class="wrap"><div class="controls"><div class="tabs"><button id="dailyBtn" class="active" type="button">日报</button><button id="lateBtn" type="button">尾盘</button><button id="weeklyBtn" type="button">周报</button><button id="archiveBtn" type="button">最近一周</button></div><label class="pick">报告日期<select id="reportSelect"></select></label></div><section class="metrics" id="metrics"></section><section class="meta" id="meta"></section><section id="content"></section></main>
  <script>
    const S={view:"daily",date:"",recent:null,daily:null,late:null,weekly:null,logs:[]};
    const $=id=>document.getElementById(id), btns={daily:$("dailyBtn"),late:$("lateBtn"),weekly:$("weeklyBtn"),archive:$("archiveBtn")};
    $("dailyBtn").onclick=()=>setView("daily");$("lateBtn").onclick=()=>setView("late");$("weeklyBtn").onclick=()=>setView("weekly");$("archiveBtn").onclick=()=>setView("archive");$("reportSelect").onchange=async e=>{S.date=e.target.value;await loadCurrent();render()};
    init();
    async function init(){nextRun();setInterval(nextRun,60000);loading();await loadRecent();S.date=listFor("daily")[0]||"";syncDates();await loadCurrent();render()}
    async function setView(v){S.view=v;Object.values(btns).forEach(b=>b.classList.remove("active"));btns[v].classList.add("active");$("reportSelect").disabled=v==="weekly"||v==="archive";S.date=listFor(v)[0]||S.date;syncDates();await loadCurrent();render()}
    async function json(p){const r=await fetch(p,{headers:{Accept:"application/json"},cache:"no-cache"});const x=await r.json().catch(()=>({}));if(!r.ok)throw Error(x.error||`请求失败 ${r.status}`);return x}
    async function loadRecent(){try{S.recent=await json("data/reports/recent.json")}catch{S.recent={dailyReports:[],lateReports:[],weeklyReports:[],reports:[],jobLogs:[]}}S.logs=S.recent.jobLogs||[]}
    function listFor(v){if(!S.recent)return[];if(v==="late")return S.recent.lateReports||[];if(v==="weekly")return S.recent.weeklyReports||[];if(v==="archive")return S.recent.dailyReports||S.recent.reports?.map(r=>r.date)||[];return S.recent.dailyReports||S.recent.reports?.map(r=>r.date)||[]}
    async function loadCurrent(){if(S.view==="weekly"){await loadWeekly();return}if(S.view==="archive"){return}const d=S.date;if(!d){S[S.view]={stocks:[],status:"missing",error:"暂无已生成报告。"};return}try{S[S.view]=await json(`data/reports/${S.view}/${encodeURIComponent(d)}.json`)}catch(e){S[S.view]={date:d,stocks:[],status:"missing",error:e.message}}}
    async function loadWeekly(){const weeks=listFor("weekly");const w=weeks[0];try{S.weekly=await json(w?`data/reports/weekly/${encodeURIComponent(w)}.json`:"data/reports/weekly-latest.json")}catch(e){S.weekly={stocks:[],status:"missing",error:e.message}}}
    function syncDates(){const dates=listFor(S.view);$("reportSelect").innerHTML=dates.map(d=>`<option value="${esc(d)}">${esc(d)}</option>`).join("");if(dates.includes(S.date))$("reportSelect").value=S.date;else if(dates[0]){$("reportSelect").value=dates[0];S.date=dates[0]}}
    function loading(){$("metrics").innerHTML="";$("meta").innerHTML=`<div><h2>正在加载独立报告</h2><p>正在读取 GitHub Pages 静态报告数据。</p></div><span class="badge">GitHub Pages</span>`;$("content").innerHTML=`<div class="empty">正在连接报告数据...</div>`}
    function render(){if(S.view==="daily")market(S.daily,"日报");if(S.view==="late")market(S.late,"尾盘报告");if(S.view==="weekly")weekly();if(S.view==="archive")archive()}
    function metric(items,label){items=items||[];const top=items[0],total=items.reduce((s,i)=>s+Number(i.activityScore||i.appearances||0),0),avg=items.length?Math.round(items.reduce((s,i)=>s+Number(i.momentumScore||i.avgMomentumScore||0),0)/items.length):0;$("metrics").innerHTML=`<div class="metric"><span>${label}入选标的</span><b>${items.length} 只</b></div><div class="metric"><span>最高热度</span><b>${top?`${esc(top.name)} · ${top.heatScore||top.weeklyHeatScore}`:"暂无"}</b></div><div class="metric"><span>行情活跃度</span><b>${Math.round(total)}</b></div><div class="metric"><span>平均趋势强度</span><b>${avg}</b></div>`}
    function market(r,title){const stocks=r?.stocks||[];metric(stocks,title);$("meta").innerHTML=`<div><h2>${esc(r?.date||S.date||"最近")} ${title}</h2><p>生成时间：${dt(r?.generatedAt)}<br>数据来源：${esc(r?.source||"等待行情数据生成")}；非投资建议。</p></div><span class="badge">${esc(r?.status||"未生成")}</span>`;if(!stocks.length){$("content").innerHTML=empty(r?.error||"暂无真实行情报告。未到自动执行时间或数据返回失败时，不会生成假数据。");return}$("content").innerHTML=prev(r)+`<div class="list">${stocks.map(stock).join("")}</div>`;requestAnimationFrame(()=>stocks.forEach(draw))}
    function prev(r){const raw=r?.previousDayStocksTodayChange||[];const items=Array.isArray(raw)?raw:(raw.items||[]);if(!items.length)return"";return`<section class="prev"><h3>昨日入选股票今日表现</h3><div class="prevgrid">${items.map(i=>`<div class="previtem"><span>${esc(i.name||i.symbol||"-")}</span><b style="color:${Number(i.todayChangePct??i.changePct)>=0?"var(--red)":"var(--green)"}">${pctOr(i.todayChangePct??i.changePct)}</b><small>昨日涨幅：${pctOr(i.yesterdayChangePct)}<br>昨日涨停：${i.wasLimitUpYesterday?'是':'否'}<br>收盘/当前较开盘：${pctOr(i.todayCloseVsOpenPct)}</small></div>`).join("")}</div></section>`}
    function concept(i){const a=[...(i.conceptFeedback||[]),...(i.keyPoints||[]),...(i.positiveFactors||[])].filter(Boolean);return [...new Set(a)].slice(0,2)}
    function stock(i){const a=i.kline?.[0],b=i.kline?.[i.kline.length-1],cf=concept(i);return`<article class="card"><div class="head"><div class="title"><span class="rank">${i.rank}</span><div class="name"><b>${esc(i.name)}</b><span>${esc(i.symbol)}</span></div></div><div class="field"><span>热度评分</span><b>${i.heatScore}</b></div><div class="field"><span>趋势强度</span><b>${i.momentumScore}</b></div><div class="field"><span>当日涨跌幅</span><b style="color:${Number(i.changePct)>=0?"var(--red)":"var(--green)"}">${pct(i.changePct)}</b></div></div><div class="body"><div class="points"><h3>行情驱动摘要</h3><ul>${(i.keyPoints||[]).map(p=>`<li>${esc(p)}</li>`).join("")}</ul><div class="tags">${(i.positiveFactors||[]).map(f=>`<span>${esc(f)}</span>`).join("")}</div>${cf.length?`<div class="warn"><b>主要概念反馈：</b>${cf.map(esc).join('；')}</div>`:""}<div class="warn">成交额：${amt(i.amount)}；大单资金净额：${amt(i.bigOrderNetAmount)}；大单净占比：${pct(i.largeOrderNetRatio)}；主力资金净额：${amt(i.mainNetInflow)}；换手率：${pct(i.turnoverRate)}；量比：${num(i.volumeRatio)}；振幅：${pct(i.amplitude)}</div>${(i.dataStatus&&i.dataStatus!=="ok")||i.klineStatus==="行情数据异常"?`<div class="warn">行情数据异常：未返回真实 K 线。</div>`:""}</div><div class="chart"><h3>近半年真实日 K</h3><canvas id="chart-${attr(i.symbol)}" width="760" height="360"></canvas><div class="cap"><span>${a?esc(a.date):"无起始数据"}</span><span>${b?`收盘 ${b.close}`:"无收盘数据"}</span><span>${b?esc(b.date):"无结束数据"}</span></div></div></div></article>`}
    function weekly(){const r=S.weekly||{},stocks=r.stocks||[];metric(stocks,"本周");$("meta").innerHTML=`<div><h2>${esc(r.week||"最近一周")} 周报</h2><p>统计范围：${esc(r.rangeStart||"-")} 至 ${esc(r.rangeEnd||"-")}<br>生成时间：${dt(r.generatedAt)}；尾盘与日报同口径，周报只汇总16:00日报。</p></div><span class="badge">${esc(r.status||"未生成")}</span>`;if(!stocks.length){$("content").innerHTML=empty(r.error||"暂无周报。需要至少一份真实行情日报，或等待周五 22:15 自动汇总。");return}$("content").innerHTML=`<table><thead><tr><th>排名</th><th>股票</th><th>综合热度</th><th>入选次数</th><th>一周行情特征</th></tr></thead><tbody>${stocks.map(i=>`<tr><td>${i.rank}</td><td><b>${esc(i.name)}</b><br><span>${esc(i.symbol)}</span></td><td>${i.weeklyHeatScore}</td><td>${i.appearances} 天</td><td>${esc(i.weeklySummary)}</td></tr>`).join("")}</tbody></table>`}
    async function archive(){const dates=listFor("archive");metric([],"归档");$("meta").innerHTML=`<div><h2>最近一周报告归档</h2><p>这里展示 GitHub Actions 已生成的最近报告。</p></div><span class="badge">${dates.length} 份报告</span>`;if(!dates.length){$("content").innerHTML=empty("暂无归档报告。");return}$("content").innerHTML=`<table><thead><tr><th>类型</th><th>日期/周</th></tr></thead><tbody>${(S.recent.dailyReports||[]).map(d=>`<tr><td>日报</td><td>${esc(d)}</td></tr>`).join("")}${(S.recent.lateReports||[]).map(d=>`<tr><td>尾盘</td><td>${esc(d)}</td></tr>`).join("")}${(S.recent.weeklyReports||[]).map(w=>`<tr><td>周报</td><td>${esc(w)}</td></tr>`).join("")}</tbody></table>`}
    function empty(m){const l=S.logs[0];return`<div class="empty"><b>${esc(m)}</b><br>${l?`最近任务：${esc(l.jobName)} · ${esc(l.status)} · ${dt(l.finishedAt)}<br>${esc(l.errorMessage||"")}`:"暂无任务日志。"}</div>`}
    function draw(i){const c=$(`chart-${i.symbol}`);if(!c||!i.kline?.length)return;const x=c.getContext("2d"),w=c.width,h=c.height,p={l:54,r:22,t:24,b:36},d=i.kline,ps=d.flatMap(v=>[v.high,v.low]).map(Number).filter(Number.isFinite);if(!ps.length)return;const min=Math.min(...ps)*.98,max=Math.max(...ps)*1.02,step=(w-p.l-p.r)/d.length,y=v=>p.t+(max-v)/(max-min)*(h-p.t-p.b);x.clearRect(0,0,w,h);x.fillStyle="#fbfcfe";x.fillRect(0,0,w,h);x.strokeStyle="#e4e9f0";x.font="12px Arial";x.fillStyle="#657082";for(let k=0;k<=4;k++){const gy=p.t+k*(h-p.t-p.b)/4;x.beginPath();x.moveTo(p.l,gy);x.lineTo(w-p.r,gy);x.stroke();x.fillText((max-k*(max-min)/4).toFixed(max>100?0:1),10,gy+4)}d.forEach((v,k)=>{const cx=p.l+k*step+step/2,up=Number(v.close)>=Number(v.open);x.strokeStyle=x.fillStyle=up?"#d84b47":"#178f61";x.beginPath();x.moveTo(cx,y(Number(v.high)));x.lineTo(cx,y(Number(v.low)));x.stroke();const t=y(Math.max(Number(v.open),Number(v.close))),bt=y(Math.min(Number(v.open),Number(v.close)));x.fillRect(cx-Math.max(2,step*.28),t,Math.max(4,step*.56),Math.max(2,bt-t))});x.fillStyle="#657082";x.fillText(d[0].date,p.l,h-12);x.fillText(d[d.length-1].date,w-p.r-72,h-12)}
    function nextRun(){const n=new Date(),d=new Date(n);d.setHours(16,0,0,0);if(n>=d)d.setDate(d.getDate()+1);while(d.getDay()===0||d.getDay()===6)d.setDate(d.getDate()+1);$("nextRun").textContent=`${d.toLocaleDateString("zh-CN")} 16:00`}
    function dt(v){return v?new Date(v).toLocaleString("zh-CN",{hour12:false}):"未生成"}function amt(v){const n=Number(v||0);if(Math.abs(n)>=1e8)return`${(n/1e8).toFixed(1)} 亿`;if(Math.abs(n)>=1e4)return`${(n/1e4).toFixed(0)} 万`;return String(Math.round(n))}function pct(v){return`${Number(v||0).toFixed(2)}%`}function pctOr(v){const n=Number(v);return Number.isFinite(n)?`${n.toFixed(2)}%`:"暂无数据"}function num(v){return Number(v||0).toFixed(2)}function esc(v){return String(v??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]))}function attr(v){return esc(v).replace(/`/g,"&#96;")}
  </script>
</body>
</html>
