<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A 股行情热度报告（尾盘+收盘报告）</title>
  <style>
    :root{--ink:#17202c;--muted:#667085;--line:#d8dee8;--paper:#fff;--red:#d84b47;--green:#178f61;--shadow:0 10px 28px rgba(26,32,44,.08)}
    *{box-sizing:border-box}body{margin:0;font-family:"Microsoft YaHei","PingFang SC","Segoe UI",Arial,sans-serif;color:var(--ink);background:#eef2f6}
    header{background:#17202c;color:#fff;padding:22px 28px 18px;border-bottom:4px solid #d7a43b}.wrap{max-width:1280px;margin:0 auto}
    .top{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end}h1{margin:0;font-size:clamp(26px,4vw,42px);letter-spacing:0}.sub{margin:8px 0 0;color:#c9d2df;line-height:1.6;max-width:920px}
    .schedule{min-width:320px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:14px 16px}.row{display:flex;justify-content:space-between;gap:14px;color:#dbe4ef;font-size:13px;line-height:1.8}
    main{padding:22px 28px 36px}.controls{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}.tabs{display:flex;gap:8px;flex-wrap:wrap}
    button,select{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;min-height:38px;padding:0 14px;font-weight:700}button{cursor:pointer}button.active{background:#17202c;color:#fff;border-color:#17202c}.pick{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;font-weight:700}
    .metrics{display:grid;grid-template-columns:repeat(4,minmax(160px,1fr));gap:12px;margin-bottom:18px}.metric,.meta,.card,.empty,.prev{background:var(--paper);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}
    .metric{padding:14px 16px;min-height:86px}.metric span{display:block;color:var(--muted);font-size:13px;margin-bottom:8px}.metric b{display:block;font-size:24px;line-height:1.2}
    .meta{padding:16px 18px;margin-bottom:16px;display:flex;justify-content:space-between;gap:20px;align-items:center}.meta h2{margin:0 0 6px;font-size:20px}.meta p{margin:0;color:var(--muted);line-height:1.6}
    .badge,.limit{display:inline-flex;border-radius:999px;padding:6px 10px;background:#fff6dc;color:#7d560d;border:1px solid #efd28a;font-size:13px;font-weight:800;white-space:nowrap}.limit{margin-left:0;background:#fff1f0;color:#b42318;border-color:#fecdca;font-size:12px;padding:3px 7px;vertical-align:middle;flex:0 0 auto}
    .prev{padding:16px 18px;margin-bottom:14px}.prev h3{margin:0 0 12px;font-size:16px}.prevgrid{display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));gap:10px}.previtem{border:1px solid #e2e7ef;border-radius:8px;padding:10px 12px;background:#fbfcfe}.previtem span{display:block;color:var(--muted);font-size:12px;overflow-wrap:anywhere}.previtem b{display:block;margin-top:6px;font-size:18px}.previtem small{display:block;color:var(--muted);line-height:1.6;margin-top:6px}
    .stocklinks{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}.stocklinks a{color:#145e58;text-decoration:none;border:1px solid #c8e3df;border-radius:999px;padding:3px 8px;font-size:12px;font-weight:800;background:#eef7f6}.scoreline{grid-column:2 / 5;display:grid;grid-template-columns:repeat(3,minmax(120px,1fr));gap:14px}.scoreline .field{min-width:0}
    .list{display:grid;gap:14px}.card{overflow:hidden}.head{display:grid;grid-template-columns:minmax(220px,1.3fr) repeat(3,minmax(145px,.7fr));gap:14px;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line);background:#fbfcfe}
    .title{display:flex;align-items:center;min-width:0}.rank{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;background:#17202c;color:#fff;border-radius:8px;font-weight:900;margin-right:10px;flex:0 0 auto}.name b{display:flex;align-items:center;gap:8px;font-size:19px;overflow-wrap:anywhere}.name span{display:block;color:var(--muted);font-size:13px;margin-top:3px}.field span{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}.field b{font-size:18px}
    .body{display:grid;grid-template-columns:minmax(280px,1fr) minmax(320px,460px);gap:18px;padding:18px}.points h3,.chart h3{margin:0 0 10px;font-size:16px}.points ul{margin:0;padding-left:20px;line-height:1.75}.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.tags span{background:#eef7f6;color:#145e58;border:1px solid #c8e3df;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800}.warn{margin-top:10px;color:#92400e;background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.6}
    .chart{border-left:1px solid var(--line);padding-left:18px;min-width:0}canvas{width:100%;height:230px;display:block;background:#fbfcfe;border:1px solid #e2e7ef;border-radius:8px}.cap{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:12px;margin-top:8px}
    .plink{border:0;background:transparent;color:#7d560d;text-decoration:underline;padding:0;margin-left:10px;min-height:0;font-weight:800}.modal{position:fixed;inset:0;background:rgba(23,32,44,.45);display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}.modal[hidden]{display:none}.modalbox{width:min(720px,100%);background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:16px}.modalhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.modalhead h3{margin:0;font-size:18px}#portfolioChart{height:300px}
    table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:var(--shadow)}th,td{text-align:left;padding:14px 16px;border-bottom:1px solid var(--line);vertical-align:top}th{background:#17202c;color:#fff;font-size:13px}.empty{padding:28px;color:var(--muted);text-align:center;line-height:1.8}.empty b{color:var(--ink)}
    @media(max-width:960px){.top,.body,.meta{grid-template-columns:1fr;display:grid}.schedule{min-width:0}.metrics{grid-template-columns:repeat(2,minmax(150px,1fr))}.prevgrid{grid-template-columns:repeat(2,minmax(140px,1fr))}.head{grid-template-columns:1fr 1fr}.scoreline{grid-column:1 / -1;grid-template-columns:repeat(3,minmax(120px,1fr))}.chart{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:16px}}
    @media(max-width:620px){header,main{padding-left:16px;padding-right:16px}.metrics,.head,.prevgrid{grid-template-columns:1fr}.scoreline{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.scoreline .field b{font-size:16px}.stocklinks a{padding:3px 7px}.controls{align-items:stretch}.tabs,.pick{width:100%}button,select{flex:1}th,td{padding:11px 10px}}
  </style>
</head>
<body>
  <header><div class="wrap top"><div><h1>A 股行情热度报告（尾盘+收盘报告）</h1><p class="sub">交易日 14:50 生成尾盘报告，16:00 生成日报；周五 22:15 汇总周报。尾盘、日报和周报为三类独立报告，页面默认打开当前最新已生成的尾盘或日报。</p></div><div class="schedule"><strong>自动任务</strong><div class="row"><span>尾盘报告</span><b>14:50</b></div><div class="row"><span>交易日日报</span><b>16:00</b></div><div class="row"><span>周五周报</span><b>22:15</b></div></div></div></header>
  <main class="wrap"><div class="controls"><div class="tabs"><button id="lateBtn" type="button">尾盘</button><button id="dailyBtn" type="button">日报</button><button id="weeklyBtn" type="button">周报</button><button id="archiveBtn" type="button">最近一周</button></div><label class="pick">报告日期<select id="reportSelect"></select></label></div><section class="metrics" id="metrics"></section><section class="meta" id="meta"></section><section id="content"></section></main>
  <div id="portfolioModal" class="modal" hidden><div class="modalbox"><div class="modalhead"><h3>模拟盘净值曲线</h3><button type="button" onclick="closePortfolioModal()">关闭</button></div><canvas id="portfolioChart" width="760" height="360"></canvas><div id="portfolioMeta" class="cap"></div></div></div>
  <script>
    const S={view:"daily",dailyDate:"",lateDate:"",recent:[],lateRecent:[],daily:null,late:null,weekly:null,logs:[]};
    const $=id=>document.getElementById(id),btns={late:$("lateBtn"),daily:$("dailyBtn"),weekly:$("weeklyBtn"),archive:$("archiveBtn")};
    $("lateBtn").onclick=()=>setView("late");$("dailyBtn").onclick=()=>setView("daily");$("weeklyBtn").onclick=()=>setView("weekly");$("archiveBtn").onclick=()=>setView("archive");$("reportSelect").onchange=async e=>{if(S.view==="late")S.lateDate=e.target.value;else if(S.view==="daily")S.dailyDate=e.target.value;await loadByView();render()};
    init();
    async function init(){loading();await Promise.allSettled([loadRecent(),loadLogs()]);chooseInitialView();syncDates();await loadByView();render()}
    function chooseInitialView(){const d=S.recent[0]?.date||"",l=S.lateRecent[0]?.date||"";S.dailyDate=d;S.lateDate=l;if(l&&(!d||l>d))S.view="late";else if(d)S.view="daily";else if(l)S.view="late";else S.view="daily";activate()}
    async function setView(v){S.view=v;activate();if(v==="late"&&!S.lateDate)S.lateDate=S.lateRecent[0]?.date||"";if(v==="daily"&&!S.dailyDate)S.dailyDate=S.recent[0]?.date||"";$("reportSelect").disabled=v==="weekly"||v==="archive";syncDates();await loadByView();render()}
    function activate(){Object.values(btns).forEach(b=>b.classList.remove("active"));btns[S.view]?.classList.add("active")}
    async function loadByView(){if(S.view==="late")await loadLate(S.lateDate);else if(S.view==="daily")await loadDaily(S.dailyDate);else if(S.view==="weekly"&&!S.weekly)await loadWeekly();else if(S.view==="archive")await loadRecent()}
    async function json(p){const r=await fetch(p,{headers:{Accept:"application/json"},cache:"no-cache"});const x=await r.json().catch(()=>({}));if(!r.ok)throw Error(x.error||`请求失败 ${r.status}`);return x}
    async function loadRecent(){try{const p=await json("data/reports/recent.json");S.recent=p.reports||[];S.lateRecent=p.lateReports||[]}catch{S.recent=[];S.lateRecent=[]}syncDates()}
    async function loadLogs(){try{S.logs=(await json("data/reports/logs.json")).logs||[]}catch{S.logs=[]}}
    async function loadDaily(d){if(!d){S.daily={stocks:[],status:"missing",error:"暂无已生成日报。"};return}try{S.daily=await json(`data/reports/daily/${encodeURIComponent(d)}.json`)}catch(e){S.daily={date:d,stocks:[],status:"missing",error:e.message}}}
    async function loadLate(d){if(!d){S.late={stocks:[],status:"missing",error:"暂无已生成尾盘报告。"};return}try{S.late=await json(`data/reports/late/${encodeURIComponent(d)}.json`)}catch(e){S.late={date:d,stocks:[],status:"missing",error:e.message}}}
    async function loadWeekly(){try{S.weekly=await json("data/reports/weekly-latest.json")}catch(e){S.weekly={stocks:[],status:"missing",error:e.message}}}
    function currentDates(){return S.view==="late"?S.lateRecent.map(r=>r.date):S.view==="daily"?S.recent.map(r=>r.date):[]}
    function currentDate(){return S.view==="late"?S.lateDate:S.dailyDate}
    function syncDates(){const dates=currentDates();$("reportSelect").innerHTML=dates.map(d=>`<option value="${esc(d)}">${esc(d)}</option>`).join("");const current=currentDate();if(S.view==="late"&&!dates.includes(S.lateDate))S.lateDate=dates[0]||"";if(S.view==="daily"&&!dates.includes(S.dailyDate))S.dailyDate=dates[0]||"";$("reportSelect").value=currentDate()}
    function loading(){$("metrics").innerHTML="";$("meta").innerHTML=`<div><h2>正在加载报告</h2><p>读取 GitHub Pages 静态报告数据。</p></div><span class="badge">GitHub Pages</span>`;$("content").innerHTML=`<div class="empty">正在连接报告数据...</div>`}
    function render(){if(S.view==="late")market(S.late,"尾盘");if(S.view==="daily")market(S.daily,"日报");if(S.view==="weekly")weekly();if(S.view==="archive")archive()}
    function metric(items,label,total){items=items||[];const top=items[0],avg=items.length?Math.round(items.reduce((s,i)=>s+Number(i.momentumScore||i.avgMomentumScore||0),0)/items.length):0;$("metrics").innerHTML=`<div class="metric"><span>${label}入选标的</span><b>${items.length} 只</b></div><div class="metric"><span>覆盖候选</span><b>${total||"-"}</b></div><div class="metric"><span>最高热度</span><b>${top?`${esc(top.name)} · ${top.heatScore||top.weeklyHeatScore}`:"暂无"}</b></div><div class="metric"><span>平均趋势强度</span><b>${avg}</b></div>`}
    function market(r,label){const stocks=r?.stocks||[];metric(stocks,label,r?.totalCandidates);$("meta").innerHTML=`<div><h2>${esc(r?.date||currentDate()||"最近")} ${label}报告</h2><p>生成时间：${dt(r?.generatedAt)}<br>${esc(r?.ratingPolicy||"")}<br>数据来源：${esc(r?.source||"等待行情数据生成")}；${esc(r?.notice||"非投资建议。")}</p></div><span class="badge">${esc(r?.status||"未生成")}</span>`;if(!stocks.length){$("content").innerHTML=empty(r?.error||`暂无${label}报告。`);return}$("content").innerHTML=prev(r,label)+`<div class="list">${stocks.map(stock).join("")}</div>`;requestAnimationFrame(()=>stocks.forEach(draw))}
    function codeOf(symbol){return String(symbol||"").replace(/^(SH|SZ|BJ)/,"")}function xqSymbol(symbol){return String(symbol||"").toUpperCase()}function stockLinks(symbol){const code=codeOf(symbol),xq=xqSymbol(symbol);return `<div class="stocklinks"><a href="https://stockpage.10jqka.com.cn/${code}/" target="_blank" rel="noopener">同花顺</a><a href="https://xueqiu.com/S/${xq}" target="_blank" rel="noopener">雪球</a></div>`}
    function portfolioSummary(r,label){const p=label==="尾盘"?r?.latePortfolio:label==="日报"?r?.dailyPortfolio:null;return p?`<div class="warn">模拟盘当日净值：${Number(p.netValue||1).toFixed(4)}<button class="plink" type="button" onclick="openPortfolioModal()">查看净值曲线</button></div>`:""}
    function prev(r,label){const items=r?.previousDayStocksTodayChange?.items||[];const portfolio=portfolioSummary(r,label);if(!items.length)return portfolio;return`<section class="prev"><h3>昨日筛选股票今日表现</h3><div class="prevgrid">${items.map(i=>`<div class="previtem"><span>${esc(i.name||i.symbol||"-")}</span>${stockLinks(i.symbol)}<b style="color:${Number(i.todayChangePct)>=0?"var(--red)":"var(--green)"}">${pctOr(i.todayChangePct)}</b><small>昨日涨跌幅：${pctOr(i.yesterdayChangePct)}<br>昨日是否涨停：${i.wasLimitUpYesterday?"是":"否"}<br>今日收盘/当前价较开盘：${pctOr(i.todayCloseVsOpenPct)}</small></div>`).join("")}</div>${portfolio}<div class="warn">${label==="尾盘"?"尾盘报告生成时尚未正式收盘，价格字段按当时接口返回的当前价计算。":"日报在收盘后生成，价格字段按接口返回的收盘后快照计算。"}</div></section>`}
    function stock(i){const a=i.kline?.[0],b=i.kline?.[i.kline.length-1],concepts=(i.businessConcepts||[]).slice(0,2);return`<article class="card"><div class="head"><div class="title"><span class="rank">${i.rank}</span><div class="name"><b>${esc(i.name)}${i.isLimitUp?'<span class="limit">涨停</span>':""}</b><span>${esc(i.symbol)}</span>${stockLinks(i.symbol)}</div></div><div class="scoreline"><div class="field"><span>热度评分</span><b>${i.heatScore}</b></div><div class="field"><span>趋势强度</span><b>${i.momentumScore}</b></div><div class="field"><span>当日涨跌幅</span><b style="color:${Number(i.changePct)>=0?"var(--red)":"var(--green)"}">${pct(i.changePct)}</b></div></div></div><div class="body"><div class="points"><h3>行情驱动摘要</h3><ul>${(i.keyPoints||[]).map(p=>`<li>${esc(p)}</li>`).join("")}</ul><div class="tags">${(i.positiveFactors||[]).map(f=>`<span>${esc(f)}</span>`).join("")}</div>${concepts.length?`<div class="warn">主要概念：${concepts.map(esc).join("；")}</div>`:""}<div class="warn">成交额：${amt(i.amount)}；大单资金净额：${amt(i.bigOrderNetAmount)}；大单净占比：${pct(i.largeOrderNetRatio)}；主力资金净额：${amt(i.mainNetInflow)}；换手率：${pct(i.turnoverRate)}；量比：${num(i.volumeRatio)}；振幅：${pct(i.amplitude)}</div>${i.dataStatus!=="ok"?`<div class="warn">行情数据异常：${esc(i.dataError||"未返回真实 K 线。")}</div>`:""}</div><div class="chart"><h3>近半年真实日 K</h3><canvas id="chart-${attr(i.symbol)}" width="760" height="360"></canvas><div class="cap"><span>${a?esc(a.date):"无起始数据"}</span><span>${b?`收盘 ${b.close}`:"无收盘数据"}</span><span>${b?esc(b.date):"无结束数据"}</span></div></div></div></article>`}
    function weekly(){const r=S.weekly||{},stocks=r.stocks||[];metric(stocks,"本周","日报汇总");$("meta").innerHTML=`<div><h2>${esc(r.week||"最近一周")} 周报</h2><p>统计范围：${esc(r.rangeStart||"-")} 至 ${esc(r.rangeEnd||"-")}<br>${esc(r.ratingPolicy||"")}<br>生成时间：${dt(r.generatedAt)}；来源：${esc(r.source||"等待行情日报聚合")}</p></div><span class="badge">${esc(r.status||"未生成")}</span>`;if(!stocks.length){$("content").innerHTML=empty(r.error||"暂无周报。需要至少一份真实行情日报，或等待周五 22:15 自动汇总。");return}$("content").innerHTML=`<table><thead><tr><th>排名</th><th>股票</th><th>入选次数</th></tr></thead><tbody>${stocks.map(i=>`<tr><td>${i.rank}</td><td><b>${esc(i.name)}</b><br><span>${esc(i.symbol)}</span></td><td>${i.appearances} 天</td></tr>`).join("")}</tbody></table>${weeklyTradeSection("本周日报模拟盘交易详情",r.dailyPortfolioTrades)}${weeklyTradeSection("本周尾盘模拟盘交易详情",r.latePortfolioTrades)}`}
    function weeklyTradeSection(title,groups){groups=groups||[];if(!groups.length)return`<div class="empty">${esc(title)}：暂无交易记录。</div>`;const rows=groups.flatMap(g=>(g.trades||[]).map(t=>({...t,date:g.date,netValue:g.netValue})));return`<section class="prev"><h3>${esc(title)}</h3><table><thead><tr><th>日期</th><th>股票</th><th>买卖价格</th><th>盈亏比例</th><th>状态/说明</th></tr></thead><tbody>${rows.map(t=>`<tr><td>${esc(t.buyDate||t.date)}</td><td><b>${esc(t.name||t.symbol||"-")}</b><br><span>${esc(t.symbol||"")}</span></td><td>${tradePrice(t)}</td><td style="color:${Number(t.profitPct)>=0?"var(--red)":"var(--green)"}">${tradeProfit(t.profitPct)}</td><td>${esc(t.status||"-")}${t.reason?`<br><span>${esc(t.reason)}</span>`:""}</td></tr>`).join("")}</tbody></table></section>`}
    function tradePrice(t){const b=Number(t.buyPrice),s=Number(t.sellPrice),m=Number(t.markPrice);if(t.action==="skipped")return"-";if(Number.isFinite(b)&&Number.isFinite(s))return`${b.toFixed(2)} / ${s.toFixed(2)}`;if(Number.isFinite(b)&&Number.isFinite(m))return`${b.toFixed(2)} / 参考 ${m.toFixed(2)}`;if(Number.isFinite(b))return`${b.toFixed(2)} / 暂无数据`;if(Number.isFinite(s))return`暂无数据 / ${s.toFixed(2)}`;return"暂无数据"}function tradeProfit(v){const n=Number(v);return Number.isFinite(n)?`${n.toFixed(2)}%`:"-"}
    function archive(){const rows=[...S.recent.map(r=>({...r,label:"日报"})),...S.lateRecent.map(r=>({...r,label:"尾盘"}))].sort((a,b)=>`${b.date}${b.label}`.localeCompare(`${a.date}${a.label}`)).slice(0,7);metric(rows.flatMap(r=>r.stocks||[]).slice(0,5),"归档",rows.length);$("meta").innerHTML=`<div><h2>最近一周报告归档</h2><p>展示最近 7 份日报和尾盘报告。180 天内历史报告可通过对应报告类型的日期选择查看。</p></div><span class="badge">${rows.length} 份报告</span>`;if(!rows.length){$("content").innerHTML=empty("暂无归档报告。");return}$("content").innerHTML=`<table><thead><tr><th>日期</th><th>类型</th><th>最高热度</th><th>状态</th><th>覆盖候选</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.date)}</td><td>${esc(r.label)}</td><td>${esc(r.stocks?.[0]?.name||"-")} ${r.stocks?.[0]?.heatScore||""}</td><td>${esc(r.status||"-")}</td><td>${r.totalCandidates||"-"}</td></tr>`).join("")}</tbody></table>`}
    function empty(m){const l=S.logs[0];return`<div class="empty"><b>${esc(m)}</b><br>${l?`最近任务：${esc(l.jobName)} · ${esc(l.status)} · ${dt(l.finishedAt)}<br>${esc(l.errorMessage||"")}`:"暂无任务日志。"}</div>`}
    function draw(i){const c=$(`chart-${i.symbol}`);if(!c||!i.kline?.length)return;const x=c.getContext("2d"),w=c.width,h=c.height,p={l:54,r:22,t:24,b:36},d=i.kline,ps=d.flatMap(v=>[v.high,v.low]).map(Number).filter(Number.isFinite);if(!ps.length)return;const min=Math.min(...ps)*.98,max=Math.max(...ps)*1.02,step=(w-p.l-p.r)/d.length,y=v=>p.t+(max-v)/(max-min)*(h-p.t-p.b);x.clearRect(0,0,w,h);x.fillStyle="#fbfcfe";x.fillRect(0,0,w,h);x.strokeStyle="#e4e9f0";x.font="12px Arial";x.fillStyle="#657082";for(let k=0;k<=4;k++){const gy=p.t+k*(h-p.t-p.b)/4;x.beginPath();x.moveTo(p.l,gy);x.lineTo(w-p.r,gy);x.stroke();x.fillText((max-k*(max-min)/4).toFixed(max>100?0:1),10,gy+4)}d.forEach((v,k)=>{const cx=p.l+k*step+step/2,up=Number(v.close)>=Number(v.open);x.strokeStyle=x.fillStyle=up?"#d84b47":"#178f61";x.beginPath();x.moveTo(cx,y(Number(v.high)));x.lineTo(cx,y(Number(v.low)));x.stroke();const t=y(Math.max(Number(v.open),Number(v.close))),bt=y(Math.min(Number(v.open),Number(v.close)));x.fillRect(cx-Math.max(2,step*.28),t,Math.max(4,step*.56),Math.max(2,bt-t))});x.fillStyle="#657082";x.fillText(d[0].date,p.l,h-12);x.fillText(d[d.length-1].date,w-p.r-72,h-12)}
    function openPortfolioModal(){const m=$("portfolioModal");if(!m)return;m.hidden=false;requestAnimationFrame(drawPortfolio)}
    function closePortfolioModal(){const m=$("portfolioModal");if(m)m.hidden=true}
    function drawPortfolio(){const c=$("portfolioChart"),meta=$("portfolioMeta");if(!c)return;const active=S.view==="daily"?S.daily:S.late,field=S.view==="daily"?"dailyPortfolio":"latePortfolio";const source=Array.isArray(active?.portfolioHistory)&&active.portfolioHistory.length?active.portfolioHistory:[];const rows=source.filter(r=>Number.isFinite(Number(r.netValue))).map(r=>({date:r.date,value:Number(r.netValue)}));if(!rows.length&&active?.[field]&&Number.isFinite(Number(active[field].netValue)))rows.push({date:active.date,value:Number(active[field].netValue)});rows.sort((a,b)=>a.date.localeCompare(b.date));const x=c.getContext("2d"),w=c.width,h=c.height,p={l:54,r:22,t:24,b:40};x.clearRect(0,0,w,h);x.fillStyle="#fbfcfe";x.fillRect(0,0,w,h);if(!rows.length){x.fillStyle="#667085";x.fillText("暂无净值数据",p.l,50);if(meta)meta.textContent="暂无净值数据";return}const vals=rows.map(r=>r.value),mn=Math.min(...vals,1)*.995,mx=Math.max(...vals,1)*1.005,span=mx-mn||1,y=v=>p.t+(mx-v)/span*(h-p.t-p.b),px=i=>p.l+(rows.length===1?.5:i/(rows.length-1))*(w-p.l-p.r);x.strokeStyle="#e4e9f0";x.fillStyle="#657082";x.font="12px Arial";for(let k=0;k<=4;k++){const gy=p.t+k*(h-p.t-p.b)/4;x.beginPath();x.moveTo(p.l,gy);x.lineTo(w-p.r,gy);x.stroke();x.fillText((mx-k*span/4).toFixed(4),8,gy+4)}x.strokeStyle="#17202c";x.lineWidth=2;x.beginPath();rows.forEach((r,i)=>{const xx=px(i),yy=y(r.value);if(i)x.lineTo(xx,yy);else x.moveTo(xx,yy)});x.stroke();rows.forEach((r,i)=>{x.fillStyle="#d84b47";x.beginPath();x.arc(px(i),y(r.value),4,0,Math.PI*2);x.fill()});x.fillStyle="#657082";x.fillText(rows[0].date,p.l,h-12);x.fillText(rows[rows.length-1].date,w-p.r-74,h-12);if(meta)meta.innerHTML=`<span>${esc(rows[0].date)}</span><span>最新净值 ${rows[rows.length-1].value.toFixed(4)}</span><span>${esc(rows[rows.length-1].date)}</span>`}
    function dt(v){return v?new Date(v).toLocaleString("zh-CN",{hour12:false}):"未生成"}function amt(v){const n=Number(v||0);if(Math.abs(n)>=1e8)return`${(n/1e8).toFixed(1)} 亿`;if(Math.abs(n)>=1e4)return`${(n/1e4).toFixed(0)} 万`;return String(Math.round(n))}function pct(v){return`${Number(v||0).toFixed(2)}%`}function pctOr(v){const n=Number(v);return Number.isFinite(n)?`${n.toFixed(2)}%`:"暂无数据"}function num(v){return Number(v||0).toFixed(2)}function esc(v){return String(v??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]))}function attr(v){return esc(v).replace(/`/g,"&#96;")}
  </script>
