<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A股行情热度报告</title>
  <style>
    :root { color-scheme: light; --bg:#f6f7f9; --panel:#fff; --text:#18202a; --muted:#6b7280; --line:#dde3ea; --red:#c72828; --green:#16845f; --blue:#175cd3; }
    * { box-sizing:border-box; }
    body { margin:0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
    header { padding:28px clamp(16px,4vw,48px) 16px; background:#fff; border-bottom:1px solid var(--line); }
    h1 { margin:0 0 8px; font-size:clamp(24px,4vw,40px); letter-spacing:0; }
    .sub { color:var(--muted); max-width:980px; line-height:1.7; }
    main { padding:20px clamp(16px,4vw,48px) 48px; max-width:1280px; margin:0 auto; }
    nav { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
    button { border:1px solid var(--line); background:#fff; color:var(--text); padding:10px 14px; border-radius:8px; cursor:pointer; font-weight:650; }
    button.active { border-color:var(--blue); color:var(--blue); background:#eef4ff; }
    .toolbar, .panel, .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; }
    .toolbar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:14px; margin-bottom:16px; }
    select { min-width:180px; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:#fff; }
    .panel { padding:16px; margin-bottom:16px; }
    .meta { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:10px; }
    .metric { padding:12px; background:#f9fafb; border:1px solid var(--line); border-radius:8px; }
    .metric b { display:block; font-size:20px; margin-top:4px; }
    .muted { color:var(--muted); }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:14px; }
    .card { padding:16px; }
    .rank { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; }
    .rank h3 { margin:0; font-size:20px; }
    .score { font-size:24px; color:var(--blue); font-weight:750; }
    .stats { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin:14px 0; }
    .stat { padding:9px; background:#f9fafb; border-radius:8px; border:1px solid var(--line); min-height:58px; }
    .stat span { display:block; color:var(--muted); font-size:12px; }
    .up { color:var(--red); } .down { color:var(--green); }
    .tags { display:flex; gap:6px; flex-wrap:wrap; margin:10px 0; }
    .tag { font-size:12px; border:1px solid var(--line); border-radius:999px; padding:3px 8px; background:#fff; }
    ul { margin:8px 0 0; padding-left:18px; line-height:1.7; }
    table { width:100%; border-collapse:collapse; }
    th, td { text-align:left; border-bottom:1px solid var(--line); padding:10px 8px; }
    th { color:var(--muted); font-size:13px; }
    canvas { width:100%; height:170px; display:block; border:1px solid var(--line); border-radius:8px; background:#fff; margin-top:12px; }
    .empty { padding:32px; text-align:center; color:var(--muted); background:#fff; border:1px dashed var(--line); border-radius:8px; }
  </style>
</head>
<body>
<header>
  <h1>A股行情热度报告</h1>
  <div class="sub">GitHub 独立运行版：交易日 14:55 生成尾盘报告，16:00 生成日报，周五 22:15 生成周报。尾盘和日报使用同一热度评分；周报只汇总 16:00 日报，避免重复计分。非投资建议。</div>
</header>
<main>
  <nav>
    <button data-tab="daily" class="active">日报</button>
    <button data-tab="late">尾盘</button>
    <button data-tab="weekly">周报</button>
    <button data-tab="archive">最近一周</button>
  </nav>
  <section class="toolbar">
    <span class="muted" id="status">正在读取报告...</span>
    <select id="selector" hidden></select>
  </section>
  <section id="app"></section>
</main>
<script>
const $ = s => document.querySelector(s);
const app = $('#app');
const selector = $('#selector');
const statusEl = $('#status');
let recent = null;
let tab = 'daily';
const money = v => v == null ? '无数据' : Math.abs(v) >= 1e8 ? (v/1e8).toFixed(2)+'亿' : (v/1e4).toFixed(0)+'万';
const pct = v => v == null ? '无数据' : Number(v).toFixed(2)+'%';
const cls = v => v == null ? '' : v >= 0 ? 'up' : 'down';
async function json(path){ const r = await fetch(path, {cache:'no-store'}); if(!r.ok) throw new Error(path+' '+r.status); return r.json(); }
function esc(x){ return String(x ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function draw(canvas, data){
  const d = (data || []).filter(x => x.close != null); if(!d.length) return;
  const ctx = canvas.getContext('2d'), w = canvas.width = canvas.clientWidth * devicePixelRatio, h = canvas.height = canvas.clientHeight * devicePixelRatio;
  ctx.scale(devicePixelRatio, devicePixelRatio); const W = canvas.clientWidth, H = canvas.clientHeight;
  ctx.clearRect(0,0,W,H); const hi = Math.max(...d.map(x=>x.high)), lo = Math.min(...d.map(x=>x.low)); const pad = 12;
  const y = v => H-pad-(v-lo)/(hi-lo||1)*(H-pad*2); const step = Math.max(3, (W-pad*2)/d.length);
  d.forEach((k,i)=>{ const x=pad+i*step; ctx.strokeStyle = k.close >= k.open ? '#c72828' : '#16845f'; ctx.beginPath(); ctx.moveTo(x,y(k.high)); ctx.lineTo(x,y(k.low)); ctx.stroke(); ctx.fillStyle=ctx.strokeStyle; const top=y(Math.max(k.open,k.close)), bh=Math.max(1,Math.abs(y(k.open)-y(k.close))); ctx.fillRect(x-step*.28, top, step*.56, bh); });
}
function previousTable(items=[]){
  if(!items.length) return '<div class="empty">暂无上一交易日筛选股票表现。首次运行后会自动出现。</div>';
  return `<div class="panel"><h2>昨日筛选股票今日表现</h2><table><thead><tr><th>股票</th><th>昨日涨幅</th><th>昨日是否涨停</th><th>今日涨跌幅</th><th>今日收盘/当前价较开盘</th></tr></thead><tbody>${items.map(x=>`<tr><td>${esc(x.name)} ${esc(x.symbol)}</td><td class="${cls(x.yesterdayChangePct)}">${pct(x.yesterdayChangePct)}</td><td>${x.wasLimitUpYesterday?'是':'否'}</td><td class="${cls(x.todayChangePct)}">${pct(x.todayChangePct)}</td><td class="${cls(x.todayCloseVsOpenPct)}">${pct(x.todayCloseVsOpenPct)}</td></tr>`).join('')}</tbody></table></div>`;
}
function stockCard(s){
  return `<article class="card"><div class="rank"><h3>#${s.rank} ${esc(s.name)} <span class="muted">${esc(s.symbol)}</span></h3><div class="score">${s.heatScore ?? '-'}</div></div><div class="stats"><div class="stat"><span>涨跌幅</span><b class="${cls(s.changePct)}">${pct(s.changePct)}</b></div><div class="stat"><span>成交额</span><b>${money(s.amount)}</b></div><div class="stat"><span>换手率</span><b>${pct(s.turnoverRate)}</b></div><div class="stat"><span>量比</span><b>${s.volumeRatio ?? '无数据'}</b></div><div class="stat"><span>大单资金净额</span><b class="${cls(s.bigOrderNetAmount)}">${money(s.bigOrderNetAmount)}</b></div><div class="stat"><span>主力资金净额</span><b class="${cls(s.mainNetInflow)}">${money(s.mainNetInflow)}</b></div></div><div class="tags">${(s.positiveFactors||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><ul>${(s.keyPoints||[]).map(p=>`<li>${esc(p)}</li>`).join('')}</ul><canvas data-kline='${esc(JSON.stringify(s.kline || []))}'></canvas></article>`;
}
function renderMarket(r){
  app.innerHTML = `<div class="panel"><h2>${r.type === 'late' ? '尾盘报告' : '日报'} ${esc(r.date || '')}</h2><div class="meta"><div class="metric">生成时间<b>${esc(r.generatedAt || '-')}</b></div><div class="metric">全市场候选数<b>${r.totalCandidates ?? '-'}</b></div><div class="metric">数据源<b>东方财富 + Yahoo K线</b></div></div><p class="muted">${esc(r.ratingPolicy || '')}</p></div>${previousTable(r.previousDayStocksTodayChange)}<div class="grid">${(r.stocks||[]).map(stockCard).join('')}</div>`;
  document.querySelectorAll('canvas[data-kline]').forEach(c => draw(c, JSON.parse(c.dataset.kline || '[]')));
}
function renderWeekly(r){
  app.innerHTML = `<div class="panel"><h2>周报 ${esc(r.week || '')}</h2><p class="muted">区间：${esc(r.rangeStart)} 至 ${esc(r.rangeEnd)}。${esc(r.ratingPolicy || '')}</p></div><div class="panel"><table><thead><tr><th>排名</th><th>股票</th><th>周热度</th><th>入选次数</th><th>趋势均值</th><th>摘要</th></tr></thead><tbody>${(r.stocks||[]).map(s=>`<tr><td>${s.rank}</td><td>${esc(s.name)} ${esc(s.symbol)}</td><td>${s.weeklyHeatScore}</td><td>${s.appearances}</td><td>${s.avgMomentumScore}</td><td>${esc(s.weeklySummary)}</td></tr>`).join('')}</tbody></table></div>`;
}
function renderArchive(){
  app.innerHTML = `<div class="panel"><h2>最近报告归档</h2><table><thead><tr><th>类型</th><th>日期/周</th></tr></thead><tbody>${(recent.dailyReports||[]).map(d=>`<tr><td>日报</td><td>${d}</td></tr>`).join('')}${(recent.lateReports||[]).map(d=>`<tr><td>尾盘</td><td>${d}</td></tr>`).join('')}${(recent.weeklyReports||[]).map(w=>`<tr><td>周报</td><td>${w}</td></tr>`).join('')}</tbody></table></div>`;
}
async function load(){
  statusEl.textContent = '读取中...'; selector.hidden = true;
  if(tab === 'archive'){ renderArchive(); statusEl.textContent = '最近归档'; return; }
  const list = tab === 'daily' ? recent.dailyReports : tab === 'late' ? recent.lateReports : recent.weeklyReports;
  if(!list || !list.length){ app.innerHTML = '<div class="empty">暂无报告。未到自动执行时间或数据源返回失败时，不会生成假数据。</div>'; statusEl.textContent = '暂无报告'; return; }
  selector.hidden = false; selector.innerHTML = list.map(x=>`<option value="${x}">${x}</option>`).join('');
  const id = selector.value || list[0];
  const path = tab === 'daily' ? `data/reports/daily/${id}.json` : tab === 'late' ? `data/reports/late/${id}.json` : `data/reports/weekly/${id}.json`;
  const report = await json(path);
  tab === 'weekly' ? renderWeekly(report) : renderMarket(report);
  statusEl.textContent = `当前查看：${id}`;
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{ document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active')); b.classList.add('active'); tab=b.dataset.tab; load().catch(showErr); });
selector.onchange = () => load().catch(showErr);
function showErr(e){ app.innerHTML = `<div class="empty">读取失败：${esc(e.message)}</div>`; statusEl.textContent = '读取失败'; }
(async()=>{ try{ recent = await json('data/reports/recent.json'); await load(); } catch(e){ showErr(e); } })();
</script>
</body>
</html>
