<script>
const $=id=>document.getElementById(id);
const n=v=>Number(v);
const fmt=v=>Number.isFinite(n(v))?n(v).toFixed(4):"-";
const pct=v=>Number.isFinite(n(v))?(n(v)>=0?"+":"")+n(v).toFixed(2)+"%":"-";
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let report=null;
function load(){
 fetch("data/reports/etf-rotation-latest.json",{cache:"no-cache"}).then(r=>{if(!r.ok)throw Error("No report");return r.json()}).then(r=>{report=r;render()}).catch(()=>{
  $("meta").innerHTML="<b>&#26242;&#26080; ETF &#36718;&#21160;&#25253;&#21578;</b><p class='muted'>&#20132;&#26131;&#26085; 14:53 &#21518;&#65292;&#21482;&#22312;&#30495;&#23454;&#34892;&#24773;&#21644;&#26085; K &#25968;&#25454;&#23436;&#25972;&#26102;&#29983;&#25104;&#12290;</p>";
 });
}
function render(){
 const h=report.holding;
 $("meta").innerHTML="<b>"+esc(report.date)+" ETF &#36718;&#21160;&#25253;&#21578;</b><p class='muted'>&#29983;&#25104;&#26102;&#38388;&#65306;"+esc(new Date(report.generatedAt).toLocaleString("zh-CN",{hour12:false}))+"&#65288;&#25253;&#20215;&#24555;&#29031; 14:53&#65289;</p>";
 const holding=h?esc(h.name)+" <span class='tag'>"+esc(h.symbol)+"</span>":"&#31354;&#20179;";
 const rows=(report.etfs||[]).map(e=>"<tr><td><b>"+esc(e.name)+"</b><br><span class='tag'>"+esc(e.symbol)+"</span></td><td>"+fmt(e.price)+"</td><td class='"+(n(e.momentum20Pct)>=0?"up":"down")+"'>"+pct(e.momentum20Pct)+"</td><td>"+fmt(e.ma28)+"</td><td>"+(e.aboveMa28?"&#28385;&#36275;":"&#19981;&#28385;&#36275;")+"</td></tr>").join("");
 const trades=(report.rebalance||[]).map(t=>"<div class='trade'><b>"+(t.action==="buy"?"&#20080;&#20837;":"&#21334;&#20986;")+" "+esc(t.name)+"</b><br><span class='muted'>"+esc(t.symbol)+" / 14:53 "+fmt(t.price)+(Number.isFinite(n(t.returnPct))?" / "+pct(t.returnPct):"")+"</span></div>").join("");
 $("content").innerHTML="<section class='metrics'><div class='metric'><span>&#24403;&#21069;&#31574;&#30053;&#20928;&#20540;</span><b>"+fmt(report.netValue)+"</b><button class='link' id='curve' type='button'>&#26597;&#30475;&#20928;&#20540;&#26354;&#32447;</button></div><div class='metric'><span>&#24403;&#26085;&#25345;&#20179;&#26631;&#30340;</span><b>"+holding+"</b></div><div class='metric'><span>&#31574;&#30053;&#21442;&#25968;</span><b>20&#26085;&#28072;&#36300;&#24133; / MA28</b><span class='tag'>&#25353; 14:53 &#30495;&#23454;&#20215;&#26684;&#25191;&#34892;</span></div></section><section class='card'><h2>&#20845;&#21482; ETF &#25191;&#34892;&#26102;&#28857;&#34892;&#24773;</h2><div class='table'><table><thead><tr><th>ETF</th><th>14:53&#20215;&#26684;</th><th>20&#26085;&#28072;&#36300;&#24133;</th><th>MA28</th><th>MA28&#26465;&#20214;</th></tr></thead><tbody>"+rows+"</tbody></table></div></section>"+(trades?"<section class='card'><h2>&#24403;&#26085;&#35843;&#20179;</h2><div class='rebalance'>"+trades+"</div></section>":"");
 $("curve").onclick=()=>{$("modal").hidden=false;draw()};
}
function draw(){
 const items=(report.portfolioHistory||[]).filter(x=>Number.isFinite(n(x.netValue))).sort((a,b)=>a.date.localeCompare(b.date));
 const canvas=$("chart"),ctx=canvas.getContext("2d"),w=canvas.width,h=canvas.height,p={l:55,r:20,t:20,b:35};
 ctx.clearRect(0,0,w,h);ctx.fillStyle="#fff";ctx.fillRect(0,0,w,h);
 if(!items.length){ctx.fillStyle="#667085";ctx.fillText("No data",55,50);return}
 const vals=items.map(x=>n(x.netValue)),min=Math.min(...vals)*.995,max=Math.max(...vals)*1.005,span=max-min||1;
 const x=i=>p.l+(items.length===1?.5:i/(items.length-1))*(w-p.l-p.r),y=v=>p.t+(max-v)/span*(h-p.t-p.b);
 ctx.strokeStyle="#e2e8f0";for(let i=0;i<5;i++){const yy=p.t+i*(h-p.t-p.b)/4;ctx.beginPath();ctx.moveTo(p.l,yy);ctx.lineTo(w-p.r,yy);ctx.stroke()}
 ctx.strokeStyle="#1769aa";ctx.lineWidth=2;ctx.beginPath();items.forEach((item,i)=>i?ctx.lineTo(x(i),y(n(item.netValue))):ctx.moveTo(x(i),y(n(item.netValue))));ctx.stroke();
 items.forEach((item,i)=>{if(!item.rebalanced)return;ctx.fillStyle="#b42318";ctx.beginPath();ctx.arc(x(i),y(n(item.netValue)),4,0,Math.PI*2);ctx.fill()});
 ctx.fillStyle="#667085";ctx.font="12px Arial";ctx.fillText(items[0].date,p.l,h-12);ctx.fillText(items.at(-1).date,w-p.r-72,h-12);
 $("caption").innerHTML="&#32418;&#28857;&#65306;&#35843;&#20179;&#28857; / &#26368;&#26032;&#20928;&#20540; "+fmt(items.at(-1).netValue);
}
