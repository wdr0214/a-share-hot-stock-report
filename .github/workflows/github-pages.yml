name: GitHub Pages Report

on:
  push:
    branches: [main]
  schedule:
    - cron: "55 6 * * 1-5"
    - cron: "0 8 * * 1-5"
    - cron: "15 14 * * 5"
  workflow_dispatch:
    inputs:
      job:
        description: "Job to run"
        required: true
        default: "export"
        type: choice
        options:
          - export
          - late
          - daily
          - weekly
      date:
        description: "Optional report date YYYY-MM-DD"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Add portfolio equity curve modal
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'outputs/xueqiu-stock-report.html';
          let s = fs.readFileSync(path, 'utf8');
          s = s.replace('table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:var(--shadow)}', '.plink{border:0;background:transparent;color:#7d560d;text-decoration:underline;padding:0;margin-left:10px;min-height:0;font-weight:800}.modal{position:fixed;inset:0;background:rgba(23,32,44,.45);display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}.modal[hidden]{display:none}.modalbox{width:min(720px,100%);background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:16px}.modalhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.modalhead h3{margin:0;font-size:18px}#portfolioChart{height:300px}table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:var(--shadow)}');
          s = s.replace('</main>\n  <script>', '</main>\n  <div id="portfolioModal" class="modal" hidden><div class="modalbox"><div class="modalhead"><h3>模拟盘净值曲线</h3><button type="button" onclick="closePortfolioModal()">关闭</button></div><canvas id="portfolioChart" width="760" height="360"></canvas><div id="portfolioMeta" class="cap"></div></div></div>\n  <script>');
          s = s.replace('const portfolio=label==="尾盘"&&r?.latePortfolio?`<div class="warn">模拟盘当日净值：${Number(r.latePortfolio.netValue||1).toFixed(4)}</div>`:"";', 'const portfolio=label==="尾盘"&&r?.latePortfolio?`<div class="warn">模拟盘当日净值：${Number(r.latePortfolio.netValue||1).toFixed(4)}<button class="plink" type="button" onclick="openPortfolioModal()">查看净值曲线</button></div>`:"";');
          const insert = 'function openPortfolioModal(){const m=$("portfolioModal");if(!m)return;m.hidden=false;requestAnimationFrame(drawPortfolio)}\n    function closePortfolioModal(){const m=$("portfolioModal");if(m)m.hidden=true}\n    function drawPortfolio(){const c=$("portfolioChart"),meta=$("portfolioMeta");if(!c)return;const rows=[...(S.lateRecent||[])].filter(r=>r.latePortfolio&&Number.isFinite(Number(r.latePortfolio.netValue))).map(r=>({date:r.date,value:Number(r.latePortfolio.netValue)}));if(S.late?.latePortfolio&&Number.isFinite(Number(S.late.latePortfolio.netValue))&&!rows.some(r=>r.date===S.late.date))rows.push({date:S.late.date,value:Number(S.late.latePortfolio.netValue)});rows.sort((a,b)=>a.date.localeCompare(b.date));const x=c.getContext("2d"),w=c.width,h=c.height,p={l:54,r:22,t:24,b:40};x.clearRect(0,0,w,h);x.fillStyle="#fbfcfe";x.fillRect(0,0,w,h);if(!rows.length){x.fillStyle="#667085";x.fillText("暂无净值数据",p.l,50);if(meta)meta.textContent="暂无净值数据";return}const vals=rows.map(r=>r.value),mn=Math.min(...vals,1)*.995,mx=Math.max(...vals,1)*1.005,span=mx-mn||1,y=v=>p.t+(mx-v)/span*(h-p.t-p.b),px=i=>p.l+(rows.length===1?.5:i/(rows.length-1))*(w-p.l-p.r);x.strokeStyle="#e4e9f0";x.fillStyle="#657082";x.font="12px Arial";for(let k=0;k<=4;k++){const gy=p.t+k*(h-p.t-p.b)/4;x.beginPath();x.moveTo(p.l,gy);x.lineTo(w-p.r,gy);x.stroke();x.fillText((mx-k*span/4).toFixed(4),8,gy+4)}x.strokeStyle="#17202c";x.lineWidth=2;x.beginPath();rows.forEach((r,i)=>{const xx=px(i),yy=y(r.value);if(i)x.lineTo(xx,yy);else x.moveTo(xx,yy)});x.stroke();rows.forEach((r,i)=>{x.fillStyle="#d84b47";x.beginPath();x.arc(px(i),y(r.value),4,0,Math.PI*2);x.fill()});x.fillStyle="#657082";x.fillText(rows[0].date,p.l,h-12);x.fillText(rows[rows.length-1].date,w-p.r-74,h-12);if(meta)meta.innerHTML=`<span>${esc(rows[0].date)}</span><span>最新净值 ${rows[rows.length-1].value.toFixed(4)}</span><span>${esc(rows[rows.length-1].date)}</span>`}\n    ';
          s = s.replace('function dt(v){return v?new Date(v).toLocaleString("zh-CN",{hour12:false}):"未生成"}', insert + 'function dt(v){return v?new Date(v).toLocaleString("zh-CN",{hour12:false}):"未生成"}');
          fs.writeFileSync(path, s, 'utf8');
          NODE

      - name: Generate late-session report
        if: github.event.schedule == '55 6 * * 1-5' || github.event.inputs.job == 'late'
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            npm run run:late -- "${{ github.event.inputs.date }}"
          else
            npm run run:late
          fi

      - name: Generate daily report
        if: github.event.schedule == '0 8 * * 1-5' || github.event.inputs.job == 'daily'
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            npm run run:daily -- "${{ github.event.inputs.date }}"
          else
            npm run run:daily
          fi

      - name: Generate weekly report
        if: github.event.schedule == '15 14 * * 5' || github.event.inputs.job == 'weekly'
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            npm run run:weekly -- "${{ github.event.inputs.date }}"
          else
            npm run run:weekly
          fi

      - name: Export static report data
        run: npm run export:static

      - name: Prepare GitHub Pages entry
        run: cp outputs/xueqiu-stock-report.html outputs/index.html

      - name: Persist generated report data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f outputs/data/reports outputs/index.html outputs/xueqiu-stock-report.html
          if [ -f data/reports.json ]; then
            git add -f data/reports.json
          fi
          git diff --cached --quiet || git commit -m "Update generated stock reports"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: outputs

      - id: deployment
        uses: actions/deploy-pages@v4
