name: GitHub Pages Report

on:
  push:
    branches: [main]
  schedule:
    - cron: "55 6 * * 1-5"
    - cron: "0 8 * * 1-5"
    - cron: "15 14 * * 5"
  workflow_dispatch:
    inputs:
      job:
        description: "Job to run"
        required: true
        default: "export"
        type: choice
        options:
          - export
          - late
          - daily
          - weekly
      date:
        description: "Optional report date YYYY-MM-DD"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Adjust limit-up label position
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('outputs/xueqiu-stock-report.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('.name b{display:block;font-size:19px;overflow-wrap:anywhere}', '.name b{display:flex;align-items:center;gap:8px;font-size:19px;overflow-wrap:anywhere}')
          s = s.replace('.limit{margin-left:8px;background:#fff1f0;color:#b42318;border-color:#fecdca;font-size:12px;padding:3px 7px;vertical-align:middle}', '.limit{margin-left:0;background:#fff1f0;color:#b42318;border-color:#fecdca;font-size:12px;padding:3px 7px;vertical-align:middle;flex:0 0 auto}')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Generate late-session report
        if: github.event.schedule == '55 6 * * 1-5' || github.event.inputs.job == 'late'
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            npm run run:late -- "${{ github.event.inputs.date }}"
          else
            npm run run:late
          fi

      - name: Generate daily report
        if: github.event.schedule == '0 8 * * 1-5' || github.event.inputs.job == 'daily'
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            npm run run:daily -- "${{ github.event.inputs.date }}"
          else
            npm run run:daily
          fi

      - name: Generate weekly report
        if: github.event.schedule == '15 14 * * 5' || github.event.inputs.job == 'weekly'
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            npm run run:weekly -- "${{ github.event.inputs.date }}"
          else
            npm run run:weekly
          fi

      - name: Export static report data
        run: npm run export:static

      - name: Prepare GitHub Pages entry
        run: cp outputs/xueqiu-stock-report.html outputs/index.html

      - name: Persist generated report data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f outputs/data/reports outputs/index.html outputs/xueqiu-stock-report.html
          if [ -f data/reports.json ]; then
            git add -f data/reports.json
          fi
          git diff --cached --quiet || git commit -m "Update generated stock reports"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: outputs

      - id: deployment
        uses: actions/deploy-pages@v4
