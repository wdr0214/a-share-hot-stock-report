name: GitHub Pages Report

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      job:
        description: "Job to run"
        required: true
        default: "export"
        type: choice
        options:
          - export
          - late
          - daily
          - weekly
          - etf-rotation
          - catchup
      date:
        description: "Optional report date YYYY-MM-DD"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NETLIFY_DATA_PROXY_BASE: https://10-5-k.vercel.app
      NETLIFY_DATA_PROXY_TOKEN: ${{ secrets.NETLIFY_DATA_PROXY_TOKEN }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Apply GitHub runtime market-data patch
        run: node scripts/github-runtime-patch.mjs

      - name: Generate late-session report
        if: github.event.inputs.job == 'late'
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            npm run run:late -- "${{ github.event.inputs.date }}"
          else
            npm run run:late
          fi

      - name: Generate daily report
        if: github.event.inputs.job == 'daily'
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            npm run run:daily -- "${{ github.event.inputs.date }}"
          else
            npm run run:daily
          fi

      - name: Generate weekly report
        if: github.event.inputs.job == 'weekly'
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            npm run run:weekly -- "${{ github.event.inputs.date }}"
          else
            npm run run:weekly
          fi

      - name: Generate ETF rotation report
        if: github.event.inputs.job == 'etf-rotation'
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            npm run run:etf-rotation -- "${{ github.event.inputs.date }}"
          else
            npm run run:etf-rotation
          fi

      - name: Manual catchup
        if: github.event.inputs.job == 'catchup'
        run: npm run run:catchup

      - name: Export static report data
        if: github.event_name == 'workflow_dispatch'
        run: npm run export:static

      - name: Prepare GitHub Pages entry
        run: cp outputs/xueqiu-stock-report.html outputs/index.html

      - name: Persist generated report data
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f outputs/data/reports outputs/index.html outputs/xueqiu-stock-report.html outputs/etf-rotation.html
          if [ -f data/reports.json ]; then
            git add -f data/reports.json
          fi
          git diff --cached --quiet || git commit -m "Update generated stock reports"
          git push || (git pull --rebase origin main && git push)

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: outputs

      - id: deployment
        uses: actions/deploy-pages@v4
